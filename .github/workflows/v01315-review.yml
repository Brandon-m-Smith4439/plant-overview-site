name: v0.13.15 pointer editor review
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Encoding and syntax
        run: |
          npm run validate:encoding
          npm run validate:js
          npm run validate:process-pointers
      - name: Editor and viewer regressions
        run: |
          npm run validate:labels
          npm run validate:layout-tools
          npm run validate:editor-tabs
          npm run validate:public-viewer
          npm run validate:mobile-viewer
          npm run validate:overview-stability
      - name: Rendering performance
        run: |
          npm run validate:performance
          npm run validate:retained-renderer
          npm run validate:production-performance
          npm run validate:deep-performance
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
