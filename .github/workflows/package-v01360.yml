name: Validate v0.13.60 shared envelopes and combat polish

on:
  push:
    branches:
      - release-v01360-shared-envelopes-weapons
    paths:
      - ".github/workflows/package-v01360.yml"

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release-v01360-shared-envelopes-weapons

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/v01360.patch.b64 | xz -d > /tmp/v01360.patch
          git apply --check /tmp/v01360.patch
          git apply /tmp/v01360.patch

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run validate:js

      - name: Validate shared workspace
        run: npm run validate:shared-workspace

      - name: Validate mobile viewer
        run: npm run validate:mobile-viewer

      - name: Validate compact envelopes
        run: npm run validate:compact-envelopes

      - name: Validate first person
        run: npm run validate:first-person

      - name: Validate first-person collisions
        run: npm run validate:first-person-collisions

      - name: Validate first-person rendering
        run: npm run validate:first-person-rendering

      - name: Validate combat mode
        run: npm run validate:combat

      - name: Validate animations
        run: npm run validate:animations

      - name: Build production site
        run: npm run build

      - name: Commit clean validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brandon-m-Smith4439"
          git config user.email "masterchief4439@gmail.com"
          rm -f .github/v01360.patch.b64 .github/workflows/package-v01360.yml
          git add -A
          git commit -m "v0.13.60 sync machine envelopes across devices and polish combat weapons"
          git push origin HEAD:release-v01360-shared-envelopes-weapons

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          FULL="monroe-glass-plant-evolution-v0.13.60-full-project.zip"
          CHANGED="monroe-glass-plant-evolution-v0.13.60-changed-files.zip"
          BASE="1881baf44fdfef965e3dfdd7c6ced5f873087908"

          zip -rq "$FULL" . -x ".git/*" "node_modules/*" ".next/*" "dist/*" ".wrangler/*" "build/*"

          rm -rf changed-files
          mkdir -p changed-files
          git diff --name-only "$BASE"..HEAD | while IFS= read -r file; do
            [ -f "$file" ] || continue
            mkdir -p "changed-files/$(dirname "$file")"
            cp "$file" "changed-files/$file"
          done
          (cd changed-files && zip -rq "../$CHANGED" .)

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: full-project-v0.13.60
          path: monroe-glass-plant-evolution-v0.13.60-full-project.zip
          if-no-files-found: error

      - name: Upload changed files
        uses: actions/upload-artifact@v4
        with:
          name: changed-files-v0.13.60
          path: monroe-glass-plant-evolution-v0.13.60-changed-files.zip
          if-no-files-found: error
