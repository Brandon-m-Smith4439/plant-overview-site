name: Validate v0.13.61 envelope and combat final

on:
  push:
    branches:
      - release-v01361-envelope-combat-final
    paths:
      - ".github/workflows/package-v01361.yml"

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release-v01361-envelope-combat-final

      - name: Apply reviewed v0.13.61 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/v01361.patch.b64 | xz -d > /tmp/v01361.patch
          git apply --3way --index /tmp/v01361.patch
          git diff --check --cached

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run validate:js

      - name: Validate shared workspace
        run: npm run validate:shared-workspace

      - name: Validate first person
        run: npm run validate:first-person

      - name: Validate first-person collisions
        run: npm run validate:first-person-collisions

      - name: Validate first-person rendering
        run: npm run validate:first-person-rendering

      - name: Validate mobile viewer
        run: npm run validate:mobile-viewer

      - name: Validate compact envelopes
        run: npm run validate:compact-envelopes

      - name: Validate combat mode
        run: npm run validate:combat

      - name: Validate animations
        run: npm run validate:animations

      - name: Build production site
        run: npm run build

      - name: Commit clean validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brandon-m-Smith4439"
          git config user.email "masterchief4439@gmail.com"
          rm -f .github/v01361.patch.b64 .github/workflows/package-v01361.yml
          git add -A
          git commit -m "v0.13.61 finalize shared envelopes combat button and weapon polish"
          git push origin HEAD:release-v01361-envelope-combat-final

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          FULL="monroe-glass-plant-evolution-v0.13.61-full-project.zip"
          CHANGED="monroe-glass-plant-evolution-v0.13.61-changed-files.zip"

          zip -rq "$FULL" . -x ".git/*" "node_modules/*" ".next/*" "dist/*" ".wrangler/*" "build/*"

          rm -rf changed-files
          mkdir -p changed-files
          for file in             CHANGELOG.md README.md VERSION             app/api/editor-session/route.ts app/api/shared-workspace/route.ts             app/legacy-script-loader.tsx app/machine-studio/page.tsx app/page.tsx             package.json package-lock.json             public/editor-access.js public/machine-design-studio.js public/machine-studio.html             public/plant-app.js public/plant-combat.js public/preview.html public/shared-workspace.js             tests/validate-combat-mode.mjs tests/validate-shared-workspace.mjs
          do
            mkdir -p "changed-files/$(dirname "$file")"
            cp "$file" "changed-files/$file"
          done
          (cd changed-files && zip -rq "../$CHANGED" .)

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: full-project-v0.13.61
          path: monroe-glass-plant-evolution-v0.13.61-full-project.zip
          if-no-files-found: error

      - name: Upload changed files
        uses: actions/upload-artifact@v4
        with:
          name: changed-files-v0.13.61
          path: monroe-glass-plant-evolution-v0.13.61-changed-files.zip
          if-no-files-found: error
