name: Package v0.13.40 release

on:
  push:
    paths:
      - ".github/workflows/package-v01340.yml"

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run validate:js

      - name: Validate label system
        run: node tests/validate-label-system.mjs

      - name: Build production site
        run: npm run build

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          FULL="monroe-glass-plant-evolution-v0.13.40-full-project.zip"
          CHANGED="monroe-glass-plant-evolution-v0.13.40-changed-files.zip"
          BASE="cae3df735568c6672b7b89bda5dad44d182afaa5"

          zip -rq "$FULL" .             -x ".git/*" "node_modules/*" ".next/*" "dist/*"                ".github/workflows/package-v01340.yml"

          rm -rf changed-files
          mkdir -p changed-files
          git diff --name-only "$BASE" HEAD --             ":(exclude).github/workflows/package-v01340.yml" > /tmp/changed-files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            mkdir -p "changed-files/$(dirname "$file")"
            cp "$file" "changed-files/$file"
          done < /tmp/changed-files.txt
          (cd changed-files && zip -rq "../$CHANGED" .)

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: full-project-v0.13.40
          path: monroe-glass-plant-evolution-v0.13.40-full-project.zip
          if-no-files-found: error

      - name: Upload changed files
        uses: actions/upload-artifact@v4
        with:
          name: changed-files-v0.13.40
          path: monroe-glass-plant-evolution-v0.13.40-changed-files.zip
          if-no-files-found: error
