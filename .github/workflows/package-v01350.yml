          change_entry = '''## 0.13.50 - 2026-10-06

- Added an owner-only Combat Mode launcher to the private owner dashboard and plant viewer. Public visitors, local editor profiles, and ordinary editor sessions do not receive the combat control; a valid owner-session flag is required.
- Combat Mode reuses the existing first-person walkthrough without modifying saved plant data. Person, animated-person, and person-design machines become temporary enemy AI only for the active game session.
- Enemy AI fires only when it has line of sight to the player. Plant machines, design collision envelopes, structural columns, and walls are reused as shot/sight occluders.
- Added a generic primary rifle and secondary handgun with weapon switching (1/2), mouse fire, magazines, reserves, reloads (R), hit markers, health, incoming-fire feedback, victory/defeat screens, and restart.
- Combat pauses naturally whenever pointer lock is released, including the Esc first-person options menu, preventing enemies from damaging the owner while menus are open.
- Added a dedicated combat HUD and game-styled weapon silhouettes while keeping the standard first-person HUD hidden during the owner-only game layer.
- Added Combat Mode validation and advanced cache/version tokens to v0.13.50.

'''
          if not changelog.startswith("## 0.13.50"):
              changelog = change_entry + changelog
          write("CHANGELOG.md", changelog)

          readme = read("README.md")
          readme_entry = '''## Version 0.13.50

Version 0.13.50 adds an owner-only Combat Mode on top of the existing first-person plant walkthrough. The private owner dashboard can open the combat-ready plant view, where the owner can start a temporary FPS session. Person/team-member machine objects become line-of-sight enemy AI, while machines, columns, walls, and designer collision envelopes block shots and enemy vision. The player has a generic primary rifle and secondary handgun, ammo/reload management, health, hit feedback, win/defeat states, and restart controls. None of the combat state is saved into the plant model, and the feature remains unavailable to public or ordinary editor sessions.

'''
          marker = "## Version 0.13.49"
          if marker in readme and "## Version 0.13.50" not in readme:
              readme = readme.replace(marker, readme_entry + marker, 1)
          elif "## Version 0.13.50" not in readme:
              readme = readme_entry + readme
          write("README.md", readme)
          PY

