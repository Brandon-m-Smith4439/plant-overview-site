name: v0.13.14 encoding and performance review
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Encoding and syntax
        run: |
          npm run validate:encoding
          npm run validate:js
      - name: Designer and label regressions
        run: |
          npm run validate:designer
          npm run validate:labels
          npm run validate:structure-camera
          node tests/validate-designer-delete-snap-toolbar.mjs
          node tests/validate-designer-switch-performance.mjs
          node tests/validate-scale-envelope-redraw.mjs
      - name: Performance regressions
        run: |
          npm run validate:performance
          npm run validate:overlap-performance
          npm run validate:renderer
          npm run validate:retained-renderer
          npm run validate:production-performance
          npm run validate:deep-performance
          npm run validate:overview-stability
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
