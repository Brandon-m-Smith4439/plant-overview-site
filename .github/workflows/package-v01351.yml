name: Package v0.13.51 release

on:
  push:
    paths:
      - ".github/workflows/package-v01351.yml"

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run validate:js

      - name: Validate first-person navigation
        run: npm run validate:first-person

      - name: Validate owner combat mode
        run: npm run validate:combat

      - name: Build production site
        run: npm run build

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          FULL="monroe-glass-plant-evolution-v0.13.51-full-project.zip"
          CHANGED="monroe-glass-plant-evolution-v0.13.51-changed-files.zip"

          zip -rq "$FULL" . \
            -x ".git/*" "node_modules/*" ".next/*" "dist/*" \
               ".github/workflows/package-v01351.yml"

          rm -rf changed-files
          mkdir -p changed-files
          for file in \
            CHANGELOG.md README.md VERSION \
            app/globals.css app/legacy-script-loader.tsx app/page.tsx app/machine-studio/page.tsx \
            package.json package-lock.json \
            public/plant-app.js public/plant-combat.js public/preview.html public/machine-studio.html \
            tests/validate-combat-mode.mjs
          do
            mkdir -p "changed-files/$(dirname "$file")"
            cp "$file" "changed-files/$file"
          done
          (cd changed-files && zip -rq "../$CHANGED" .)

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: full-project-v0.13.51
          path: monroe-glass-plant-evolution-v0.13.51-full-project.zip
          if-no-files-found: error

      - name: Upload changed files
        uses: actions/upload-artifact@v4
        with:
          name: changed-files-v0.13.51
          path: monroe-glass-plant-evolution-v0.13.51-changed-files.zip
          if-no-files-found: error
