name: Package v0.13.49 release

on:
  push:
    paths:
      - ".github/workflows/package-v01349.yml"

permissions:
  contents: write

jobs:
  validate-commit-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Apply v0.13.49 source patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | xz -d > /tmp/v01349.patch
          git apply --check /tmp/v01349.patch
          git apply /tmp/v01349.patch

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run validate:js

      - name: Validate machine labels
        run: npm run validate:labels

      - name: Validate editor tabs
        run: npm run validate:editor-tabs

      - name: Build production site
        run: npm run build

      - name: Commit v0.13.49 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brandon-m-Smith4439"
          git config user.email "masterchief4439@gmail.com"
          git add CHANGELOG.md README.md VERSION app/globals.css app/legacy-script-loader.tsx app/machine-studio/page.tsx app/page.tsx package-lock.json package.json public/machine-studio.html public/plant-app.js public/preview.html tests/validate-label-system.mjs
          git commit -m "v0.13.49 revamp machine label settings"
          git push origin HEAD:main

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          FULL="monroe-glass-plant-evolution-v0.13.49-full-project.zip"
          CHANGED="monroe-glass-plant-evolution-v0.13.49-changed-files.zip"
          zip -rq "$FULL" . -x ".git/*" "node_modules/*" ".next/*" "dist/*" ".github/workflows/package-v01349.yml"
          rm -rf changed-files
          mkdir -p changed-files
          for file in CHANGELOG.md README.md VERSION app/globals.css app/legacy-script-loader.tsx app/machine-studio/page.tsx app/page.tsx package-lock.json package.json public/machine-studio.html public/plant-app.js public/preview.html tests/validate-label-system.mjs; do
            mkdir -p "changed-files/$(dirname "$file")"
            cp "$file" "changed-files/$file"
          done
          (cd changed-files && zip -rq "../$CHANGED" .)

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: full-project-v0.13.49
          path: monroe-glass-plant-evolution-v0.13.49-full-project.zip
          if-no-files-found: error

      - name: Upload changed files
        uses: actions/upload-artifact@v4
        with:
          name: changed-files-v0.13.49
          path: monroe-glass-plant-evolution-v0.13.49-changed-files.zip
          if-no-files-found: error
