name: Package v0.13.52 combat animation release

on:
  push:
    paths:
      - ".github/workflows/package-v01352.yml"

permissions:
  contents: write

jobs:
  validate-commit-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Apply reviewed v0.13.52 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/v01352.patch.b64 | xz -d > /tmp/v01352.patch
          git apply --check /tmp/v01352.patch
          git apply /tmp/v01352.patch

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run validate:js

      - name: Validate first-person navigation
        run: npm run validate:first-person

      - name: Validate first-person collisions
        run: npm run validate:first-person-collisions

      - name: Validate first-person rendering
        run: npm run validate:first-person-rendering

      - name: Validate combat mode
        run: npm run validate:combat

      - name: Validate animation regression
        run: npm run validate:animations

      - name: Build production site
        run: npm run build

      - name: Commit v0.13.52 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Brandon-m-Smith4439"
          git config user.email "masterchief4439@gmail.com"
          git add CHANGELOG.md README.md VERSION app/globals.css app/legacy-script-loader.tsx app/machine-studio/page.tsx app/page.tsx package-lock.json package.json public/machine-studio.html public/plant-app.js public/plant-combat.js public/preview.html tests/validate-combat-mode.mjs tests/validate-first-person-collisions.mjs
          git commit -m "v0.13.52 animate combat actors and harden pillar collision"
          git push origin HEAD:main

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          FULL="monroe-glass-plant-evolution-v0.13.52-full-project.zip"
          CHANGED="monroe-glass-plant-evolution-v0.13.52-changed-files.zip"
          zip -rq "$FULL" . -x ".git/*" "node_modules/*" ".next/*" "dist/*" ".github/workflows/package-v01352.yml" ".github/v01352.patch.b64"
          rm -rf changed-files
          mkdir -p changed-files
          for file in CHANGELOG.md README.md VERSION app/globals.css app/legacy-script-loader.tsx app/machine-studio/page.tsx app/page.tsx package-lock.json package.json public/machine-studio.html public/plant-app.js public/plant-combat.js public/preview.html tests/validate-combat-mode.mjs tests/validate-first-person-collisions.mjs; do
            mkdir -p "changed-files/$(dirname "$file")"
            cp "$file" "changed-files/$file"
          done
          (cd changed-files && zip -rq "../$CHANGED" .)

      - name: Upload full project
        uses: actions/upload-artifact@v4
        with:
          name: full-project-v0.13.52
          path: monroe-glass-plant-evolution-v0.13.52-full-project.zip
          if-no-files-found: error

      - name: Upload changed files
        uses: actions/upload-artifact@v4
        with:
          name: changed-files-v0.13.52
          path: monroe-glass-plant-evolution-v0.13.52-changed-files.zip
          if-no-files-found: error
